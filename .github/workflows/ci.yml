name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: black --check run_pipeline.py src app tests

      - name: Lint
        run: flake8 run_pipeline.py src app tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Run tests
        run: python -m pytest -q
